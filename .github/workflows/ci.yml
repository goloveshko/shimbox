# What a person clicks in scripts\ is what runs here: the same masters, in the
# same order, on Windows - the only system either half of this project runs on.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Only the registry. A Tauri `target` is gigabytes, and a runner starts from
      # a different machine every time, so the honest trade is to re-download
      # nothing and re-compile anyway.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Windows PowerShell rather than the default pwsh: the masters declare
      # `#Requires -Version 5.1`, which is also what a double-clicked .cmd starts.

      # The master checks the UI with Prettier and says so when it is missing, so
      # the install belongs here rather than in a fourth build path: `npm ci` reads
      # the lock file the repository carries, which is what makes the runner format
      # the code with the same binary the pass here was made with.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install the UI formatter
        run: npm ci
        working-directory: apps/gui

      - name: Build both runners and the manager
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Profile release -NoPause -StrictSize

      - name: Smoke the runner against real binaries
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1 -NoPause

      - name: Package the release archive
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -NoPause

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin/

  # The archive lands on a draft and stays there until a person writes the release
  # text and publishes it - that text is what the app's own update card shows, so
  # it is not something a pipeline invents.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - name: Attach the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          archive="$(ls bin/*.zip)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "shimbox $tag" --notes ''
          fi
          gh release upload "$tag" "$archive" --clobber
