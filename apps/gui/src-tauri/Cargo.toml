[package]
name = "gui"
description = "shimbox manager: generates shims from a desktop UI"
version.workspace = true
license.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
# Only for reading an address the way a browser reads it before opening it.
url = "2"
