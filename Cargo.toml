[workspace]
resolver = "2"
members = ["crates/runner", "apps/gui/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = true

# Size-optimized build for the runner only (docs/techspec.md 2.2). It cannot be
# a per-package override of `release`, because `panic` and `lto` are workspace
# profile settings, and abort-on-panic would also change how the Tauri app
# handles failures.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
